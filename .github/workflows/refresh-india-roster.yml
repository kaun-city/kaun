name: Refresh India MP Roster + Activity

# Weekly. The roster changes slowly (bypolls, deaths, resignations) and
# attendance only moves while Parliament sits, so once a week is plenty.
#
# 04:00 UTC on Sundays, after refresh-wiki-wards (03:00) and the Bengaluru
# adapters before it (refresh-kppp 01:00, refresh-ifms 02:00), so nothing
# competes for the same window.
#
# ORDER MATTERS. seed-constituencies must have run at least once (every other
# in_* table has an FK to in_constituencies.pc_code), and the roster must land
# before the activity job, which needs in_mps.id. The scheduled run does
# roster-then-activity in that order in a single job for exactly that reason.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: "which adapter to run"
        required: true
        default: sansad-roster
        type: choice
        options:
          - roster-then-activity
          - seed-constituencies
          - sansad-roster
          - mp-activity
          - mp-activity-backfill
      mode:
        description: "dry-run (read-only) or apply (writes)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The India schema is additive and lands separately (PR #63). Until it is
      # applied, a scheduled run should be a clear no-op rather than a weekly
      # red X — a loader failing on a missing table tells nobody anything they
      # do not already know.
      - name: Check the India schema is present
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/in_constituencies?select=pc_code&limit=1")
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::in_constituencies is not reachable (HTTP $code) - the India schema migration has not been applied yet. Skipping."
          fi

      - name: Run India roster / activity
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          set -euo pipefail
          JOB="${{ github.event.inputs.job }}"
          MODE="${{ github.event.inputs.mode }}"
          # A scheduled run is the refresh itself: roster, then activity, applied.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            JOB="roster-then-activity"
            MODE="apply"
          fi
          FLAG=""
          if [ "$MODE" = "apply" ]; then FLAG="--apply"; fi

          case "$JOB" in
            roster-then-activity)
              node scripts/india/sansad-roster.mjs $FLAG
              node scripts/india/mp-activity.mjs $FLAG
              ;;
            seed-constituencies)  node scripts/india/seed-constituencies.mjs $FLAG ;;
            sansad-roster)        node scripts/india/sansad-roster.mjs $FLAG ;;
            mp-activity)          node scripts/india/mp-activity.mjs $FLAG ;;
            mp-activity-backfill) node scripts/india/mp-activity.mjs --backfill $FLAG ;;
            *) echo "unknown job: $JOB"; exit 1 ;;
          esac

      # Unresolved constituency joins are proposed alias rows for a human, never
      # guesses. Keeping them as an artifact is what makes that reviewable.
      - name: Upload dry-run reports and review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-roster-reports
          path: .artifacts/india/
          if-no-files-found: ignore
          retention-days: 30

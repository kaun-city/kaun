name: Refresh India MP Roster

# Manual only for now. The adapters in scripts/india/ are SKELETONS — they
# refuse --apply until implemented — so there is deliberately no cron yet.
# Intended cadence once implemented:
#   - cron: '0 4 * * 0'   # Sundays 04:00 UTC, after refresh-wiki-wards (03:00)
# The roster changes slowly (bypolls, deaths, resignations); weekly is plenty.
#
# Order matters: seed-constituencies must have run at least once (every other
# in_* table has an FK to in_constituencies.pc_code), and the roster must land
# before the activity and MPLADS jobs, which need in_mps.id.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "which adapter to run"
        required: true
        default: sansad-roster
        type: choice
        options:
          - seed-constituencies
          - sansad-roster
          - mp-activity
          - mp-activity-backfill
          - esakshi-mplads
          - myneta-affidavits
      mode:
        description: "dry-run (read-only) or apply (writes)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run India adapter (${{ github.event.inputs.job }} / ${{ github.event.inputs.mode }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          case "${{ github.event.inputs.job }}" in
            seed-constituencies)   SCRIPT="scripts/india/seed-constituencies.mjs"; ARGS="" ;;
            sansad-roster)         SCRIPT="scripts/india/sansad-roster.mjs";       ARGS="" ;;
            mp-activity)           SCRIPT="scripts/india/mp-activity.mjs";         ARGS="" ;;
            mp-activity-backfill)  SCRIPT="scripts/india/mp-activity.mjs";         ARGS="--backfill" ;;
            esakshi-mplads)        SCRIPT="scripts/india/esakshi-mplads.mjs";      ARGS="" ;;
            myneta-affidavits)     SCRIPT="scripts/india/myneta-affidavits.mjs";   ARGS="" ;;
            *) echo "unknown job"; exit 1 ;;
          esac
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            node "$SCRIPT" $ARGS --apply
          else
            node "$SCRIPT" $ARGS
          fi

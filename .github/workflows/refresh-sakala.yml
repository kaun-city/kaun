name: Refresh Sakala Performance

# Sakala (sakala.kar.nic.in) refuses GitHub Actions runners with "Host not in
# allowlist" 403s. On 2026-09-17 it answered Kaun's Vercel functions in Mumbai,
# so this job sends its requests through Kaun's India egress relay
# (apps/web/lib/egress.mjs) and runs monthly again.
#
# Fallback if the relay is ever refused too: run
#   node scripts/refresh-sakala.mjs --fetch-only --out=data/sakala/sakala-<year>.json --year=<year> --month=13
# from a residential connection, commit the artifact, and dispatch `load-sakala`.
on:
  schedule:
    # The 4th at 06:30 UTC: the whole current year (month 13), after the month turns.
    - cron: '30 6 4 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2025)'
        default: ''
      month:
        description: 'Month code (1-12 or 13 for all)'
        default: '13'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run Sakala scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          KAUN_EGRESS_URL: https://kaun.city/api/egress
          KAUN_EGRESS_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="--year=${{ github.event.inputs.year }}"
          fi
          ARGS="$ARGS --month=${{ github.event.inputs.month || '13' }}"
          node scripts/refresh-sakala.mjs $ARGS

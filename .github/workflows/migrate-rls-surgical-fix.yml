name: Migrate RLS Surgical Fix

# One-off. Manual only. Defaults to dry-run. Grounded in the 2026-05-17
# inspect-mode catalog dump — surgical 4-change RLS adjustment, not blanket.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (preview SQL) or apply (writes 4 surgical RLS changes)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrate RLS surgical fix (${{ github.event.inputs.mode }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            node scripts/migrate-rls-surgical-fix.mjs --apply
          else
            node scripts/migrate-rls-surgical-fix.mjs
          fi

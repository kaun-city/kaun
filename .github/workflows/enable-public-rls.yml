name: Enable Public Schema RLS

# One-off. Manual only. Defaults to dry-run (read-only). The migration is
# idempotent — every policy creation is guarded by a pg_policies check, and
# every ENABLE RLS is guarded by pg_class.relrowsecurity — so re-runs are
# no-ops. Closes Supabase Security Advisor `rls_disabled_in_public` across
# the public schema in a single transaction.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect (READ-ONLY: dumps pg_policies + anon privileges per public table) · dry-run (preview the apply SQL) · apply (writes per-bucket policies)"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - dry-run
          - apply

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable public-schema RLS (${{ github.event.inputs.mode }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            apply)   node scripts/migrate-enable-rls-public-schema.mjs --apply   ;;
            inspect) node scripts/migrate-enable-rls-public-schema.mjs --inspect ;;
            *)       node scripts/migrate-enable-rls-public-schema.mjs           ;;
          esac

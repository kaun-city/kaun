name: Migrate CityPulse Dedup

# One-off. Manual only. Defaults to dry-run so a careless click previews
# (read-only) instead of writing. Run 'apply' once after PR A merges; the
# script is idempotent so a re-run is safe.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (preview, read-only) or apply (adds dedup_key, backfills, de-dups, swaps the UNIQUE constraint)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Migrate CityPulse dedup (${{ github.event.inputs.mode }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            node scripts/migrate-pulse-dedup.mjs --apply
          else
            node scripts/migrate-pulse-dedup.mjs
          fi

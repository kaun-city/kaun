name: Migrate India Project Staleness View

# One-off. Manual only. Defaults to dry-run so a careless click previews
# (read-only) instead of writing.
#
# Creates exactly ONE object: v_in_central_project_staleness, the "longest
# unchanged" ranking the projects tracker (#65) needs. That ranking is over the
# whole table and over every historical snapshot, so it cannot be computed from
# the page's top-200 window.
#
# ADDITIVE ONLY — no table, column, row, policy or other view is touched, and
# the script drops-and-recreates only its own view, so a re-run is safe.
#
# PREREQUISITE: migrate-india-schema must have been applied first — this view
# reads in_central_project_snapshots. The dry-run says so if it is absent.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (preview SQL, read-only) | inspect (read-only catalog dump) | apply (creates 1 view)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - inspect
          - apply

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrate India project staleness view (${{ github.event.inputs.mode }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            node scripts/migrate-india-project-staleness.mjs --apply
          elif [ "${{ github.event.inputs.mode }}" = "inspect" ]; then
            node scripts/migrate-india-project-staleness.mjs --inspect
          else
            node scripts/migrate-india-project-staleness.mjs
          fi

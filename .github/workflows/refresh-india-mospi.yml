name: Refresh India Central Projects (MoSPI)

# Monthly, on the 5th at 05:00 UTC. MoSPI publishes with a ~7-8 week lag, so
# monthly is the natural beat; the loader is idempotent on
# (project_code, report_month), so an extra run is a no-op rather than a
# duplicate snapshot.
#
# The parse step is the one bit of Python in the repo — Table 6 exists only
# inside a ~160-page PDF and pdfplumber is what reads it. Same setup-python
# pattern as deploy-wiki.yml. The LOAD step is Node, like every other adapter.
on:
  schedule:
    - cron: '0 5 5 * *'
  workflow_dispatch:
    inputs:
      month:
        description: "report month as YYYY-MM (blank = latest published)"
        required: false
        type: string
      pdf_release:
        description: "release tag of mirrored PDFs (blank = live PAIMANA; e.g. data-mospi-2026 when their PDF endpoint is down)"
        required: false
        type: string
      mode:
        description: "dry-run (parse + sanity-gate only) or apply (writes snapshots)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install parser dependencies
        run: pip install -r scripts/india/mospi/requirements.txt

      # Same reasoning as refresh-india-roster: until the additive India schema
      # (PR #63) is applied, a scheduled run should be a visible no-op.
      - name: Check the India schema is present
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/in_central_projects?select=project_code&limit=1")
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::in_central_projects is not reachable (HTTP $code) - the India schema migration has not been applied yet. Skipping."
          fi

      - name: Load MoSPI flash report
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh release download (pdf mirror)
        run: |
          set -euo pipefail
          MONTH="${{ github.event.inputs.month }}"
          MODE="${{ github.event.inputs.mode }}"
          PDF_RELEASE="${{ github.event.inputs.pdf_release }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="apply"; fi
          FLAG=""
          if [ "$MODE" = "apply" ]; then FLAG="--apply"; fi
          if [ -n "$PDF_RELEASE" ]; then
            # PAIMANA's PDF endpoint intermittently 500s; mirrored report PDFs
            # (unmodified public documents, provenance in the release notes)
            # feed the loader's --pdf path. Oldest month first so snapshots
            # append in publication order.
            mkdir -p .mospi-mirror
            gh release download "$PDF_RELEASE" --dir .mospi-mirror --clobber
            for f in $(ls .mospi-mirror/*.pdf | sort); do
              echo "=== loading $f ==="
              node scripts/india/load-central-projects.mjs --pdf "$f" $FLAG
            done
          else
            if [ -n "$MONTH" ]; then TARGET="--month $MONTH"; else TARGET="--latest"; fi
            node scripts/india/load-central-projects.mjs $TARGET $FLAG
          fi

      - name: Upload dry-run reports and review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-mospi-reports
          path: .artifacts/india/
          if-no-files-found: ignore
          retention-days: 30
